name: Build

# Checks that the app builds. Releases are signed, notarized and published from a Mac with
# the Developer ID certificate; see "Releasing" in the README.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # build.sh derives the version from the latest tag.
          fetch-depth: 0

      - name: Build
        run: ./build.sh
